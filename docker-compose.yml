name: papertick

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://papertick:${POSTGRES_PASSWORD}@db:5432/papertick
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  ENV: ${ENV:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  # Sub-folder prefix the UI is served under; used to build links that point
  # back into the app (verification emails, the API docs' "back to the app").
  BASE_PATH: ${BASE_PATH:-}
  # Host values this deployment answers to; empty disables the check.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  # CIDRs of proxies whose X-Forwarded-For may be believed. Empty = trust none,
  # so a client cannot choose its own rate-limit bucket or its own audit trail.
  #
  # The frontend proxies /api to this service, so the peer the backend sees is
  # always the frontend container. To record the real client address instead,
  # set this to the compose network (172.16.0.0/12 covers the default bridge)
  # AND set TRUST_PROXY_HEADERS=true on the frontend — but only when a reverse
  # proxy that rewrites X-Forwarded-For (Caddy, nginx) is genuinely in front.
  # Setting it with the frontend exposed directly lets any caller name its own
  # address. See docs/reverse-proxy.md.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-auto}
  # Keyless backstop for a Yahoo outage. Equities and ETFs only — its
  # mutual-fund series is not split-adjusted, so funds are never asked of it.
  NASDAQ_FALLBACK: ${NASDAQ_FALLBACK:-true}
  POLYGON_API_KEY: ${POLYGON_API_KEY:-}
  # Tiingo: the only configured vendor that carries mutual-fund NAVs.
  TIINGO_API_TOKEN: ${TIINGO_API_TOKEN:-}
  ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
  ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
  # Provider cache lifetimes and the shared outbound request budget. All three
  # processes below count against one bucket, so the ceiling is per deployment.
  QUOTE_CACHE_SECONDS: ${QUOTE_CACHE_SECONDS:-30}
  HISTORY_CACHE_SECONDS: ${HISTORY_CACHE_SECONDS:-3600}
  DIVIDEND_CACHE_SECONDS: ${DIVIDEND_CACHE_SECONDS:-90000}
  MARKET_UPSTREAM_PER_MINUTE: ${MARKET_UPSTREAM_PER_MINUTE:-120}
  MARKET_REFRESH_SECONDS: ${MARKET_REFRESH_SECONDS:-60}
  # Mutual-fund NAVs publish after the close, not at it; these bound the wait.
  # Prices must be split-adjusted, never dividend-adjusted; this measures
  # each provider against fixed historical fixtures monthly.
  CONVENTION_PROBE: ${CONVENTION_PROBE:-true}
  CONVENTION_MAX_AGE_HOURS: ${CONVENTION_MAX_AGE_HOURS:-24}
  CONVENTION_QUARANTINE: ${CONVENTION_QUARANTINE:-true}
  NAV_POLL_INTERVAL_SECONDS: ${NAV_POLL_INTERVAL_SECONDS:-300}
  NAV_POLL_GIVE_UP_HOURS: ${NAV_POLL_GIVE_UP_HOURS:-30}
  # Hold a stuck fund order this long if an independent source confirms the
  # NAV exists — the failure is ours, not the fund's. 0 restores a plain reject.
  NAV_HOLD_MAX_DAYS: ${NAV_HOLD_MAX_DAYS:-5}
  # Providers all unreachable: hold a due order this long before rejecting it.
  # A synthetic price is never substituted.
  MARKET_DATA_GIVE_UP_HOURS: ${MARKET_DATA_GIVE_UP_HOURS:-24}
  # Replay recurring buys the worker slept through, at their own day's price.
  CATCHUP_MISSED_RUNS: ${CATCHUP_MISSED_RUNS:-true}
  MAX_CATCHUP_DAYS: ${MAX_CATCHUP_DAYS:-30}
  ENFORCE_MARKET_HOURS: ${ENFORCE_MARKET_HOURS:-true}
  SETTLEMENT_YIELD_ANNUAL: ${SETTLEMENT_YIELD_ANNUAL:-0}
  SCENARIO_RETENTION_DAYS: ${SCENARIO_RETENTION_DAYS:-30}
  TRADE_FEE_USD: ${TRADE_FEE_USD:-0.00}
  SLIPPAGE_MODEL: ${SLIPPAGE_MODEL:-variable}
  SLIPPAGE_BPS: ${SLIPPAGE_BPS:-2}
  SLIPPAGE_BPS_MIN: ${SLIPPAGE_BPS_MIN:--1}
  SLIPPAGE_BPS_MAX: ${SLIPPAGE_BPS_MAX:-6}
  OPTION_FEE_PER_CONTRACT: ${OPTION_FEE_PER_CONTRACT:-0.65}
  RISK_FREE_RATE: ${RISK_FREE_RATE:-0.045}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
  MFA_TOKEN_TTL_SECONDS: ${MFA_TOKEN_TTL_SECONDS:-300}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
  LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-PaperTick <no-reply@papertick.example>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  EMAIL_TOKEN_TTL_SECONDS: ${EMAIL_TOKEN_TTL_SECONDS:-86400}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-PaperTick}
  # New-device email OTP, for accounts with neither a passkey nor TOTP.
  # Production only, whatever this says.
  DEVICE_VERIFICATION: ${DEVICE_VERIFICATION:-true}
  DEVICE_TRUST_DAYS: ${DEVICE_TRUST_DAYS:-30}
  DEVICE_OTP_TTL_SECONDS: ${DEVICE_OTP_TTL_SECONDS:-600}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_EMAIL: ${DEMO_EMAIL:-}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: papertick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: papertick
    volumes:
      # postgres 18+'s official image mounts at the parent dir (not .../data) so it
      # can lay out major-version-specific subdirectories for pg_ctlcluster/pg_upgrade.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertick -d papertick"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:8-alpine
    # Redis holds WebAuthn challenges, login-lockout counters, rate-limit state
    # and the market-price cache the trading engine reads. Unauthenticated, any
    # process that reaches the network can clear a lockout, delete a rate-limit
    # bucket, or set the price a trade fills at.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Run as the image's own redis user rather than starting as root and
    # dropping down: with cap_drop ALL there is no CAP_SETUID for su-exec to
    # switch with, and no CAP_DAC_OVERRIDE for root to write /data anyway.
    user: "999:1000"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Deliberately NOT published. The frontend reaches the API over this
    # network by service name, so a host port would only be a way around the
    # frontend origin — and, in production, around TLS: it would accept session
    # cookies and API keys in cleartext and skip whatever rate limiting,
    # request-size cap and logging the ingress applies. For local debugging,
    # bind loopback only: `ports: ["127.0.0.1:8000:8000"]`.
    expose:
      - "8000"
    healthcheck:
      # CMD-SHELL, not the CMD array form: Podman re-splits an exec-form argument
      # on whitespace, so `python -c "import urllib.request; ..."` reaches Python
      # as a bare `import` and the container never becomes healthy — which stops
      # worker, beat and frontend from starting at all. Handing the whole thing
      # to /bin/sh keeps the quoting intact on both runtimes.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    pids_limit: 256

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    pids_limit: 256

  beat:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    pids_limit: 128

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        # Sub-folder deployment prefix (e.g. /papertick). Compiled into the
        # build, so a change to it only takes effect with `up -d --build`.
        BASE_PATH: ${BASE_PATH:-}
    environment:
      BACKEND_URL: http://backend:8000
      BASE_PATH: ${BASE_PATH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Believe the X-Forwarded-For on inbound requests, because a reverse proxy
      # in front has already set it. Leave false when this container is reachable
      # directly: the header is then client input, and forwarding it would let a
      # caller forge its own address in the security log and the rate limiter.
      # Pairs with TRUSTED_PROXY_CIDRS on the backend — both are needed, and
      # neither is useful alone. See docs/reverse-proxy.md.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    pids_limit: 256

volumes:
  # Named explicitly (and distinctly from the pre-upgrade "papertick_pgdata") because
  # Postgres data directories aren't binary-compatible across major versions — this
  # gives the new Postgres 18 container a clean volume rather than mounting the old
  # 16-format one, which would simply fail to start. The old volume is left untouched
  # as a second safety net alongside the pg_dump backup taken before this migration.
  pgdata:
    name: papertick_pgdata_pg18
  redisdata:
